  # The instance waits for this parameter before starting, so browser spans are sent
  # to the public URL instead of each visitor's own localhost.
  AppUrlParam:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /${EnvName}/otel-demo/app-url
      Type: String
      Value: !Sub https://${Distribution.DomainName}

Outputs:
  StoreUrl:
    Value: !Sub https://${Distribution.DomainName}/
  DistributionDomain:
    Value: !GetAtt Distribution.DomainName
  PublicDomainParameter:
    Description: deploy.sh compares this with DistributionDomain to decide on the second pass
    Value: !Ref PublicDomain
  InstanceId:
    Value: !Ref Instance
  TelemetryBucketName:
    Value: !Ref TelemetryBucket
  AdminLogin:
    Value: !Ref AdminEmail
  UserPoolId:
    Description: Cognito user pool for the admin login (scripts/users.sh manages its users)
    Value: !Ref UserPool
  AdminPasswordParameter:
    Value: !Sub /${EnvName}/otel-demo/admin-password
  AdminAuthFunctionName:
    Value: !Ref AdminAuthFn
