<rect x="170" y="1140" width="1520" height="120" fill="#FFFFFF" stroke="#879196"/>
<text x="184" y="1162" font-size="12.5" fill="#232F3E"><tspan font-weight="bold">1</tspan>  Shoppers open the store over HTTPS. CloudFront is the only public entry point.</text>
<text x="184" y="1178" font-size="12.5" fill="#232F3E"><tspan font-weight="bold">2</tspan>  CloudFront reaches the internal ALB through a VPC origin; the ALB accepts CloudFront IP ranges only.</text>
<text x="184" y="1194" font-size="12.5" fill="#232F3E"><tspan font-weight="bold">3</tspan>  The ALB forwards to Envoy on the instance, which routes to the storefront, services and tools.</text>
<text x="184" y="1210" font-size="12.5" fill="#232F3E"><tspan font-weight="bold">4</tspan>  Admin paths (/grafana /jaeger /feature /loadgen /telemetry) go through Lambda@Edge, which requires a Cognito login. Other spellings and /opamp get 403.</text>
<text x="184" y="1226" font-size="12.5" fill="#232F3E"><tspan font-weight="bold">5</tspan>  The OTel Collector keeps 60 days on disk (Jaeger, Prometheus, OpenSearch) and archives everything to S3 through a gateway endpoint.</text>
<text x="184" y="1242" font-size="12.5" fill="#232F3E"><tspan font-weight="bold">6</tspan>  At boot the instance reads its settings from Parameter Store and clones your fork through the NAT Gateway. No inbound access, no SSH.</text>
<text x="1706" y="1274" font-size="10" text-anchor="end" fill="#879196">Preview rendered from the layout in generate_diagram.py; architecture.drawio has the AWS icons.</text>
